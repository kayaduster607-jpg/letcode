<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <title>Hot100 学习助手系统架构</title>
  <desc>Next.js 全栈单体提供学习、错题、笔记和管理页面，通过 Cookie 会话保护 API，使用每账号 JSON 进度。教学内容版本化，动画由脚本生成，仅公开 presentation 白名单资源。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#8BA1B2" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1210" rx="0" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="1.5" />
  <rect x="64" y="54" width="7" height="108" rx="2" fill="#365EDC" stroke="#365EDC" stroke-width="1.5" />
  <text x="94" y="76" fill="#365EDC" font-size="18" font-weight="700">HOT100 / LEARNING WORKBENCH</text>
  <text x="89" y="141" fill="#172B3A" font-size="56" font-weight="700">100 题，从理解到复盘</text>
  <text x="94" y="185" fill="#5D7181" font-size="25" font-weight="400">学习路线  →  渐进提示  →  多解法与动画  →  笔记 / 错题 / 复盘</text>
  <rect x="64" y="236" width="1000" height="146" rx="18" fill="#EAF1FF" stroke="#BFD1F7" stroke-width="1.5" />
  <text x="90" y="273" fill="#365EDC" font-size="17" font-weight="700">01 / LEARNING EXPERIENCE</text>
  <text x="90" y="318" fill="#172B3A" font-size="34" font-weight="700">Next.js App Router + React</text>
  <text x="90" y="355" fill="#5D7181" font-size="23" font-weight="400">/learn  ·  /problem/:slug  ·  /wrong-book  ·  /admin</text>
  <rect x="1120" y="236" width="416" height="146" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="1146" y="271" fill="#365EDC" font-size="17" font-weight="700">VERSIONED / SRC/DATA</text>
  <text x="1146" y="314" fill="#172B3A" font-size="29" font-weight="700">内置教学内容</text>
  <text x="1146" y="352" fill="#5D7181" font-size="22" font-weight="400">100 题 · 17 阶段 · 270 解法</text>
  <path d="M 1120 309 H 1064" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <path d="M 564 382 V 450" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <text x="588" y="424" fill="#5D7181" font-size="20" font-weight="400">AuthContext / useProgress → fetch</text>
  <rect x="64" y="450" width="1000" height="118" rx="18" fill="#17384D" stroke="#17384D" stroke-width="1.5" />
  <text x="90" y="487" fill="#AACFEF" font-size="17" font-weight="700">02 / NEXT.JS ROUTE HANDLERS</text>
  <text x="90" y="533" fill="#FFFFFF" font-size="33" font-weight="700">登录与会话  ·  学习进度  ·  管理员 API</text>
  <path d="M 564 568 V 602 H 304 M 564 602 H 824" stroke="#8BA1B2" stroke-width="2.5" fill="none" />
  <path d="M 304 602 V 630" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <path d="M 824 602 V 630" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <rect x="64" y="630" width="480" height="184" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="90" y="665" fill="#087D71" font-size="17" font-weight="700">03 / AUTHENTICATION</text>
  <text x="90" y="708" fill="#172B3A" font-size="29" font-weight="700">Cookie 会话 + scrypt</text>
  <text x="90" y="746" fill="#5D7181" font-size="22" font-weight="400">HttpOnly · SameSite=Lax · 7 天</text>
  <text x="90" y="779" fill="#5D7181" font-size="22" font-weight="400">服务端用户 / 管理员权限校验</text>
  <rect x="584" y="630" width="480" height="184" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="610" y="665" fill="#087D71" font-size="17" font-weight="700">03 / ACCOUNT-SCOPED PROGRESS</text>
  <text x="610" y="708" fill="#172B3A" font-size="29" font-weight="700">学习状态规范化</text>
  <text x="610" y="746" fill="#5D7181" font-size="22" font-weight="400">当前用户 ID 写入 · 过滤非法题号</text>
  <text x="610" y="779" fill="#5D7181" font-size="22" font-weight="400">笔记 · 提示 · 错题 · 复盘检查</text>
  <path d="M 304 814 V 882" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <path d="M 824 814 V 882" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <rect x="64" y="882" width="1000" height="164" rx="18" fill="#EAF6F1" stroke="#BDDFD2" stroke-width="1.5" />
  <text x="90" y="919" fill="#087D71" font-size="17" font-weight="700">04 / PRIVATE RUNTIME STORAGE</text>
  <text x="90" y="964" fill="#172B3A" font-size="34" font-weight="700">data/users.json</text>
  <text x="90" y="1007" fill="#5D7181" font-size="24" font-weight="400">users  +  sessions  +  progress[userId]      /      通过数据卷保存</text>
  <rect x="1120" y="450" width="416" height="184" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="1146" y="485" fill="#365EDC" font-size="17" font-weight="700">BUILD / REPRODUCIBLE</text>
  <text x="1146" y="528" fill="#172B3A" font-size="29" font-weight="700">生成动画页面</text>
  <text x="1146" y="566" fill="#5D7181" font-size="22" font-weight="400">pnpm generate:videos → ship/</text>
  <text x="1146" y="599" fill="#5D7181" font-size="22" font-weight="400">无需密钥；语音合成可选</text>
  <path d="M 1328 634 V 714" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" />
  <rect x="1120" y="714" width="416" height="218" rx="18" fill="#FFFFFF" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="1146" y="749" fill="#365EDC" font-size="17" font-weight="700">API / PUBLIC ASSET BOUNDARY</text>
  <text x="1146" y="792" fill="#172B3A" font-size="29" font-weight="700">presentation/ 白名单</text>
  <text x="1146" y="830" fill="#5D7181" font-size="22" font-weight="400">HTML · JS · CSS · 音频 · 图片</text>
  <text x="1146" y="863" fill="#5D7181" font-size="22" font-weight="400">拦截隐藏配置、密钥与越界路径</text>
  <text x="1146" y="896" fill="#5D7181" font-size="22" font-weight="400">演示目录与私人数据分开</text>
  <path d="M 1120 823 H 1092 V 510 H 1064" fill="none" stroke="#8BA1B2" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round" stroke-dasharray="7 6" />
  <text x="1146" y="990" fill="#365EDC" font-size="23" font-weight="700">浏览器 iframe 播放生成页面</text>
  <text x="1146" y="1028" fill="#5D7181" font-size="21" font-weight="400">生成资源不进入 Git 历史</text>
  <path d="M 64 1100 H 1536" stroke="#D4E0E7" stroke-width="1.5" />
  <text x="64" y="1147" fill="#365EDC" font-size="17" font-weight="700">DEPLOYMENT</text>
  <text x="278" y="1147" fill="#172B3A" font-size="25" font-weight="700">Docker Compose  :3001</text>
  <text x="800" y="1147" fill="#5D7181" font-size="23" font-weight="400">./data → /app/data</text>
  <text x="1212" y="1147" fill="#5D7181" font-size="23" font-weight="400">单服务 · 单实例</text>
  <text x="64" y="1187" fill="#5D7181" font-size="20" font-weight="400">教学内容可版本化，演示资源可重建，个人学习数据独立保存。主应用无需 API Key。</text>
</svg>